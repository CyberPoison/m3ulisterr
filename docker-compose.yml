version: '3.8'

services:
  # Reverse Proxy to fix VPN asymmetric routing.
  # This receives your public web traffic and forwards it locally to the VPN container.
  web-proxy:
    image: caddy:alpine
    container_name: m3ulisterr-proxy
    ports:
      - "8080:80"  # Exposed to the internet
    command: caddy reverse-proxy --from :80 --to gluetun:80
    depends_on:
      - gluetun
    restart: unless-stopped

  # Gluetun VPN Container to bypass hosting company IP blocks on debrid services
  # See https://github.com/qdm12/gluetun-wiki/tree/main/setup for VPN providers
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Ports are handled by web-proxy above to prevent VPN routing issues
    environment:
      - VPN_SERVICE_PROVIDER=custom # Change to your provider (e.g., wireguard, openvpn, mullvad)
    restart: unless-stopped

  php-app:
    image: ghcr.io/cyberpoison/m3ulisterr:latest
    container_name: tmdb-vod-php
    network_mode: "service:gluetun" # Route all traffic through the Gluetun VPN
    depends_on:
      - gluetun
    volumes:
      - ./config.php:/var/www/html/config.php
      - sessions:/var/www/html/sessions
      - videos:/var/www/html/videos
      - channels:/var/www/html/channels
      - m3ulisterr_data:/data
    environment:
      - HEADLESSVIDX_ADDRESS=xxxx.xxxx.xxxx:xxx
      - PHP_MEMORY_LIMIT=1024M
      - M3U_DATA_DIR=/data
      - PREWARM_ENABLED=false
      - "PREWARM_SCHEDULE=0 */2 * * *"
      - "PREWARM_ARGS=--expiring=150 --playlist=top --limit=400 --accounts=Unlimited,UnlimitedFR --base=http://127.0.0.1 --workers=8"
    shm_size: '1gb'
    restart: unless-stopped

volumes:
  sessions:
  videos:
  channels:
  m3ulisterr_data:
