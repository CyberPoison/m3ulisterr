name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP files
        run: |
          for file in $(find . -name "*.php"); do
            php -l "$file" || exit 1
          done

  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate Release Notes
        run: |
          cat << 'PYEOF' > generate_release_notes.py
          import glob
          import re

          out_lines = ["# 🚀 Release Notes\n"]

          readmes = ["README.md"] + sorted([f for f in glob.glob("README_*.md")])

          for filepath in readmes:
              with open(filepath, "r", encoding="utf-8") as f:
                  f_content = f.read()
              
              lang_name = filepath.replace("README_", "").replace(".md", "")
              if lang_name == "README": lang_name = "English"
              
              out_lines.append(f"\n<details><summary><b>🌐 {lang_name} Changelog</b></summary>\n\n")
              
              start_idx = -1
              end_idx = -1
              lines = f_content.split("\n")
              for i, line in enumerate(lines):
                  if line.startswith("#") and "🔄" in line:
                      start_idx = i + 1
                  elif line.startswith("#") and "🙏" in line and start_idx != -1:
                      end_idx = i
                      break
              
              if start_idx != -1 and end_idx != -1:
                  changelog = "\n".join(lines[start_idx:end_idx]).strip()
                  out_lines.append(changelog)
              else:
                  out_lines.append("_Changelog not found._")
              
              out_lines.append("\n\n</details>")

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f_out:
              f_out.write("\n".join(out_lines))
          PYEOF
          python3 generate_release_notes.py

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          make_latest: true
          body_path: RELEASE_NOTES.md
